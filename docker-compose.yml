services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto-api
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./models:/models
      - ./data:/data
    restart: unless-stopped
    networks:
      - crypto-net

  front:
    build:
      context: .
      dockerfile: Dockerfile.front
    container_name: crypto-dashboard
    ports:
      - "8501:8501"
    depends_on:
      - api
    volumes:
      - .:/app
    restart: unless-stopped
    networks:
      - crypto-net

networks:
  crypto-net:
    driver: bridge
